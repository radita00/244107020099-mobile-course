name: CI/CD Pipeline
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      
      - name: Analyze Week 7 (Clean Architecture)
        working-directory: ./07-week-7-clean-architecture/campus_notify
        run: |
          flutter pub get
          flutter analyze
          dart format --set-exit-if-changed .
          flutter test
      
      - name: Verify Week 8 Docs
        run: |
          echo "🔍 Verifikasi file dokumentasi Week 8..."
          for f in \
            08-week-8-mid-project-review/README.md \
            08-week-8-mid-project-review/docs/review-checklist.md \
            08-week-8-mid-project-review/docs/ai-review-vs-keputusan.md \
            08-week-8-mid-project-review/screenshots/pr-merged.png \
            08-week-8-mid-project-review/screenshots/ci-passed.png ; do
            if [ ! -f "$f" ]; then
              echo "❌ File wajib tidak ditemukan: $f"
              exit 1
            fi
            echo "✅ $f"
          done
          echo "Semua dokumentasi Week 8 lengkap."
