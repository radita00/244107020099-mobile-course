name: CI/CD Pipeline
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      
      - name: Analyze Week 7 (Clean Architecture)
        working-directory: ./07-week-7-clean-architecture/campus_notify
        run: |
          flutter pub get
          flutter analyze
          dart format --set-exit-if-changed .
          flutter test
      
      - name: Verify Week 8 Docs
        run: |
          echo "✅ Week 8 documentation verification"
          ls -la 08-week-8-mid-project-review/
          ls -la 08-week-8-mid-project-review/docs/
          echo "All documentation files present"
